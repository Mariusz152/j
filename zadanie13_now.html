<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nowicki Zadanie 13</title>
<style>body{font-family:Arial}</style>
</head>
<body>
<h2>Rozkład ułamka egipskiego na dwa ułamki</h2>
<p>1/m = 1/(m+1) + 1/(m(m+1))</p>
<script>
var m_now=parseInt(prompt("Podaj m (liczba naturalna > 0)=","4"),10);
    if(m_now>0)document.write("1/"+m_now+" = 1/"+(m_now+1)+" + 1/"+(m_now*(m_now+1)));
    else document.write("m musi być większe od 0.");
</script>
</body>
</html>
