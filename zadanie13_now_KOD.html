<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Nowicki Zadanie 13 KOD</title><style>body{font-family:Arial}</style></head><body><h2>Kod źródłowy – zadanie 13</h2><textarea cols="100" rows="35" readonly>&lt;!doctype html&gt;&lt;html lang="pl"&gt;&lt;head&gt;&lt;meta charset="utf-8"&gt;&lt;title&gt;Nowicki Zadanie 13&lt;/title&gt;&lt;style&gt;body{font-family:Arial}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;h2&gt;Rozkład ułamka egipskiego na dwa ułamki&lt;/h2&gt;&lt;p&gt;1/m = 1/(m+1) + 1/(m(m+1))&lt;/p&gt;&lt;script&gt;
var m_now=parseInt(prompt("Podaj m (liczba naturalna &gt; 0)=","4"),10);
if(m_now&gt;0)document.write("1/"+m_now+" = 1/"+(m_now+1)+" + 1/"+(m_now*(m_now+1)));else document.write("m musi być większe od 0.");
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;</textarea></body></html>
