<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Nowicki Zadanie 16 KOD</title><style>body{font-family:Arial}</style></head><body><h2>Kod źródłowy – zadanie 16</h2><textarea cols="100" rows="35" readonly>&lt;!doctype html&gt;&lt;html lang="pl"&gt;&lt;head&gt;&lt;meta charset="utf-8"&gt;&lt;title&gt;Nowicki Zadanie 16&lt;/title&gt;&lt;style&gt;body{font-family:Arial}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div style="color:navy;font-size:28px"&gt;&lt;script&gt;
var A_now=parseFloat(prompt("Podaj pierwszą liczbę A=","1")),B_now=parseFloat(prompt("Podaj drugą liczbę B=","2"));
var a3_now=A_now**3,b3_now=B_now**3,s1_now=3*A_now*A_now*B_now,s2_now=3*A_now*B_now*B_now;
var suma_now=a3_now+s1_now+s2_now+b3_now;
document.write("wczytane liczby: A="+A_now+" B="+B_now+"&lt;br&gt;");
document.write("("+A_now+" + "+B_now+")^3 = "+A_now+"^3 + 3*("+A_now+"^2)*("+B_now+") + 3*("+A_now+")*("+B_now+"^2) + "+B_now+"^3 = "+a3_now+" + "+s1_now+" + "+s2_now+" + "+b3_now+" = "+suma_now);
&lt;/script&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;</textarea></body></html>
