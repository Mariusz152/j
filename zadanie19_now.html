<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Nowicki Z19</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; }
h1 { color: navy; }
input { margin: 5px; padding: 4px; }
.wynik { color: navy; font-size: 24px; margin-top: 15px; }
</style>
</head>
<body>
<h1>Zadanie 19 – kwadrat</h1>
<p>Mariusz Nowicki, klasa 3F, numer w dzienniku 18</p>
<script>
function Pole_now()
{
 var a_now=parseFloat(document.getElementById('dlugosc').value);
 var b_now=a_now*a_now;
 document.getElementById("nazwa").innerHTML="Pole kwadratu= "+b_now.toFixed(2)+" cm^2";
}
function obwod_now()
{
 var a_now=parseFloat(document.getElementById('dlugosc').value);
 var b_now=4*a_now;
 document.getElementById("nazwa").innerHTML="Obwód kwadratu= "+b_now.toFixed(2)+" cm";
}
</script>
Podaj długość boku:
<input type="text" id="dlugosc" value="5"> cm<br><br>
<input type="button" value="Oblicz pole" onclick="Pole_now()">
<input type="button" value="Oblicz obwód" onclick="obwod_now()">
<div class="wynik" id="nazwa"></div>
</body>
</html>
