 <html>

    <div style="color:green;font-size:48px;">
      <script language="JavaScript">
       // Mariusz Nowicki   14.10.2026
// Zadanie 11
        var D1_now = prompt("Data1=", " ");
        var D2_now = prompt("Data2=", " ");
        var sekund;
        var a = parseFloat(D1_now);
        var b = parseFloat(D2_now);
        sekund = (a - b) * 24 * 60 * 60;
        document.write(
          "Ilość sekund między dniami " + a + " i " + b + " = " + sekund + " sekund<br>"
        );

        function okno_zamknij_nowicki() {
          window.close();
        }
      </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_nowicki()" />
