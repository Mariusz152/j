<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Nowicki Z23</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; }
h1 { color: navy; }
input { margin: 5px; padding: 4px; }
.wynik { color: navy; font-size: 24px; margin-top: 15px; }
</style>
</head>
<body>
<h1>Zadanie 23 – drabina</h1>
<p>Mariusz Nowicki, klasa 3F, numer w dzienniku 18</p>
<script>
function dlugosc_now(d_now,x_now)
{
 return Math.sqrt(Math.pow(d_now,2)+Math.pow(x_now,2));
}
function kat_now(d_now,x_now)
{
 var rad_now=Math.atan(d_now/x_now);
 return rad_now*180/Math.PI;
}
function oblicz_now()
{
 var d_now=parseFloat(document.getElementById("d_now").value);
 var x_now=parseFloat(document.getElementById("x_now").value);
 var dl_now=dlugosc_now(d_now,x_now);
 var kat_wynik_now=kat_now(d_now,x_now);
 document.getElementById("dl_wynik_now").value=dl_now.toFixed(2);
 document.getElementById("kat_wynik_now").value=kat_wynik_now.toFixed(2);
}
</script>
<p>Wczytaj wysokość oparcia drabiny D oraz odległość od muru X.</p>
<form onsubmit="oblicz_now(); return false;">
D – wysokość oparcia drabiny [m]: <input id="d_now" value="4"><br>
X – odległość od muru [m]: <input id="x_now" value="3"><br><br>
<input type="submit" value="Oblicz">
</form>
<p>Długość drabiny [m]: <input id="dl_wynik_now" readonly></p>
<p>Kąt nachylenia [stopnie]: <input id="kat_wynik_now" readonly></p>
</body>
</html>
