<!doctype html>

<title>Nowicki Zadanie 11</title>
<style>body{font-family:Arial}</style>
</head>
<body>
<div style="color:green;font-size:48px">
<script>
var D1_now=parseFloat(prompt("Podaj późniejszy dzień stycznia D1=","30"));
    var D2_now=parseFloat(prompt("Podaj wcześniejszy dzień stycznia D2=","28"));
    var sekund_now=(D1_now-D2_now)*24*60*60;
    document.write("Ilość sekund między dniami "+D1_now+" i "+D2_now+" = "+sekund_now+" sekund");
</script>
</div>
</body>
